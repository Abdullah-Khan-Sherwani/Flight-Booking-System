<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Book Flight - IAT Airlines</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('home') }}">IAT Airlines</a>
    </div>
</nav>

<div class="container mt-4">
    <h2>Book Flight</h2>

    {% if flight %}
        <div class="card mb-3">
            <div class="card-body">
                <h5>Flight {{ flight[0] }}</h5>
                <p class="mb-1"><strong>Route:</strong> {{ flight[1] }} → {{ flight[2] }}</p>
                <p class="mb-1"><strong>Departure:</strong> {{ flight[3] }}</p>
                <p class="mb-1"><strong>Arrival:</strong> {{ flight[4] }}</p>
                <p class="mb-0"><strong>Aircraft:</strong> {{ flight[5] }}</p>
            </div>
        </div>
    {% endif %}

    <form method="post">
        <h4>Passenger Details</h4>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">First Name</label>
                <input name="first_name" class="form-control" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Last Name</label>
                <input name="last_name" class="form-control" required>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Email</label>
                <input name="email" type="email" class="form-control" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Phone Number</label>
                <input name="phone_number" class="form-control" required>
            </div>
        </div>

        <h4>Address</h4>
        <div class="mb-3">
            <label class="form-label">Address</label>
            <input name="address" class="form-control" required>
        </div>
        <div class="row">
            <div class="col-md-4 mb-3">
                <label class="form-label">City</label>
                <input name="city" class="form-control" required>
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">State</label>
                <input name="state" class="form-control" required>
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Zip Code</label>
                <input name="zipcode" class="form-control" required>
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label">Country</label>
            <input name="country" class="form-control" required>
        </div>

        <h4>Select Seat</h4>
        <div class="mb-3">
            <label class="form-label">Available Seats</label>
            <select name="seat_id" class="form-select" required>
                <option value="">Select a seat</option>
                {% for seat in seats %}
                    <option value="{{ seat[0] }}">
                        {{ seat[0] }} - {{ seat[1] }} (Rs {{ seat[2] or 0 }})
                    </option>
                {% endfor %}
            </select>
        </div>

        <button type="submit" class="btn btn-success">Confirm Booking</button>
        <a href="{{ url_for('home') }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>

<footer class="bg-dark text-light mt-5 py-4">
    <div class="container text-center">
        <p>&copy; 2024 IAT Airlines. All Rights Reserved.</p>
    </div>
</footer>
</body>
</html>

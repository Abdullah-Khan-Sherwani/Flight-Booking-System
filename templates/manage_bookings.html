<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Manage Bookings - IAT Airlines</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .form-container {
            max-width: 600px;
            margin: 40px auto;
            padding: 30px;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        .option-card {
            border: 2px solid #007bff;
            border-radius: 10px;
            padding: 20px;
            margin: 10px 0;
            cursor: pointer;
            transition: all 0.3s;
        }
        .option-card:hover {
            background-color: #f8f9fa;
            transform: translateY(-2px);
        }
        .option-card.selected {
            background-color: #007bff;
            color: white;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('auth.home') }}">IAT Airlines</a>
        </div>
    </nav>

    <div class="container">
        <div class="form-container">
            <h2 class="text-center mb-4">Manage Your Booking</h2>
            
            <form method="POST" action="{{ url_for('management.verify_booking') }}">
                <div class="mb-3">
                    <label for="email" class="form-label">Email or Phone Number *</label>
                    <input type="text" class="form-control" id="email" name="email" 
                           placeholder="Enter your email or phone number" required>
                    <div class="form-text">Use the email or phone number used during booking</div>
                </div>
                
                <div class="mb-3">
                    <label for="booking_id" class="form-label">Booking ID (PNR) *</label>
                    <input type="text" class="form-control" id="booking_id" name="booking_id" 
                           placeholder="e.g., ABC123" required maxlength="6">
                    <div class="form-text">Your 6-character booking reference</div>
                </div>

                <div class="mb-4">
                    <label class="form-label">What would you like to do?</label>
                    <div class="option-card" onclick="selectOption('cancel')" id="cancelOption">
                        <h5>Cancel Flight</h5>
                        <p class="mb-0">Cancel your entire booking or specific flights</p>
                    </div>
                    <div class="option-card" onclick="selectOption('reschedule')" id="rescheduleOption">
                        <h5>Reschedule Flight</h5>
                        <p class="mb-0">Change your flight dates or times</p>
                    </div>
                    <input type="hidden" id="action_type" name="action_type" required>
                </div>

                <button type="submit" class="btn btn-primary w-100" id="submitBtn" disabled>
                    Continue
                </button>
            </form>

            <div class="text-center mt-3">
                <a href="{{ url_for('auth.home') }}" class="text-decoration-none">← Back to Home</a>
            </div>
        </div>
    </div>

    <script>
        function selectOption(type) {
            document.getElementById('cancelOption').classList.remove('selected');
            document.getElementById('rescheduleOption').classList.remove('selected');
            
            document.getElementById(type + 'Option').classList.add('selected');
            document.getElementById('action_type').value = type;
            document.getElementById('submitBtn').disabled = false;
        }
    </script>
</body>
</html>

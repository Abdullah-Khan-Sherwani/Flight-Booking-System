<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Return Flight Search - IAT Airlines</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .search-box {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            margin-top: 20px;
        }
        .navbar-brand {
            font-weight: bold;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('auth.home') }}">IAT Airlines</a>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="search-box">
                    <h2 class="text-center mb-4"><i class="fas fa-plane-return me-2"></i>Search Return Flights</h2>
                    
                    <form action="{{ url_for('flights.return_flight_search') }}" method="post">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="duration" class="form-label">Duration of Stay</label>
                                <select name="duration" id="duration" class="form-control" required>
                                    <option value="">Select Duration</option>
                                    <option value="3">3 Days</option>
                                    <option value="7">1 Week</option>
                                    <option value="14">2 Weeks</option>
                                    <option value="30">1 Month</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="return_date" class="form-label">Return Date</label>
                                <input type="date" id="return_date" name="return_date" class="form-control" required>
                            </div>
                        </div>
                        
                        <div class="row mt-4">
                            <div class="col-12">
                                <button type="submit" class="btn btn-primary btn-lg w-100">
                                    <i class="fas fa-search me-2"></i>Search Return Flights
                                </button>
                            </div>
                        </div>
                    </form>
                    
                    <div class="mt-3 text-center">
                        <a href="{{ url_for('booking.seat_selection') }}" class="btn btn-outline-secondary">
                            Skip Return Flight (One Way Only)
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Set minimum return date to tomorrow
        document.addEventListener('DOMContentLoaded', function() {
            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            const tomorrowStr = tomorrow.toISOString().split('T')[0];
            document.getElementById('return_date').min = tomorrowStr;
            
            // Auto-set return date based on duration
            document.getElementById('duration').addEventListener('change', function() {
                const duration = parseInt(this.value);
                if (duration) {
                    const returnDate = new Date();
                    returnDate.setDate(returnDate.getDate() + duration);
                    document.getElementById('return_date').value = returnDate.toISOString().split('T')[0];
                }
            });
        });
    </script>
</body>
</html>
